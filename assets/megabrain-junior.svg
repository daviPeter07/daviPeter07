<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" width="420" height="190" role="img" aria-label="MegaBrain Junior, um mascote do Claude animado">
  <title>MegaBrain Junior</title>
  <style>
    :root { --text: #57606a; }
    @media (prefers-color-scheme: dark) { :root { --text: #c9d1d9; } }

    .px { shape-rendering: crispEdges; }
    .body { fill: #D97757; }
    .eye { fill: #1f1f1f; }
    .shadow { fill: #000; opacity: .12; }
    .name { font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #D97757; letter-spacing: 1px; }
    .tag { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--text); }
    .note { font: 700 22px sans-serif; fill: #D97757; opacity: 0; }
    .bubble rect { fill: #fff; stroke: #D97757; stroke-width: 2; }
    .bubble text { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f1f1f; }

    /* ciclo de 10s: parado -> olha em volta -> dança -> fala */
    .bob { animation: bob 1.4s ease-in-out infinite; }
    .jump { animation: jump 10s infinite; }
    .sway { transform-origin: 60px 100px; animation: sway 10s infinite; }
    .look { animation: look 10s infinite; }
    .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 10s infinite, eyes-open 10s infinite; }
    .eyes-happy { opacity: 0; animation: eyes-happy 10s infinite; }
    .arm-l { animation: arm-l 10s infinite; }
    .arm-r { animation: arm-r 10s infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 10s infinite; }
    .n1 { animation: note 10s infinite; }
    .n2 { animation: note 10s infinite 0.6s; }
    .n3 { animation: note 10s infinite 1.2s; }
    .bubble { opacity: 0; animation: bubble 10s infinite; }

    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

    @keyframes look {
      0%, 14%, 34%, 100% { transform: translateX(0); }
      17%, 23% { transform: translateX(-6px); }
      26%, 31% { transform: translateX(6px); }
    }

    @keyframes blink {
      0%, 9%, 11%, 37%, 39%, 85%, 87%, 100% { transform: scaleY(1); }
      10%, 38%, 86% { transform: scaleY(.1); }
    }

    @keyframes eyes-open { 0%, 44%, 76%, 100% { opacity: 1; } 45%, 75% { opacity: 0; } }
    @keyframes eyes-happy { 0%, 44%, 76%, 100% { opacity: 0; } 45%, 75% { opacity: 1; } }

    @keyframes jump {
      0%, 45%, 75%, 100% { transform: translateY(0); }
      48%, 54%, 60%, 66%, 72% { transform: translateY(-14px); }
      51%, 57%, 63%, 69% { transform: translateY(0); }
    }

    @keyframes sway {
      0%, 45%, 75%, 100% { transform: rotate(0); }
      48%, 60%, 72% { transform: rotate(-9deg); }
      54%, 66% { transform: rotate(9deg); }
    }

    @keyframes arm-l {
      0%, 45%, 75%, 100% { transform: translateY(0); }
      48%, 54%, 60%, 66%, 72% { transform: translateY(-20px); }
      51%, 57%, 63%, 69% { transform: translateY(0); }
    }

    @keyframes arm-r {
      0%, 45%, 75%, 100% { transform: translateY(0); }
      48%, 54%, 60%, 66%, 72% { transform: translateY(0); }
      51%, 57%, 63%, 69% { transform: translateY(-20px); }
      /* aceno no final */
      80%, 84%, 88% { transform: translateY(-20px); }
      82%, 86%, 90% { transform: translateY(-10px); }
      92% { transform: translateY(0); }
    }

    @keyframes shadow {
      0%, 45%, 75%, 100% { transform: scaleX(1); }
      48%, 54%, 60%, 66%, 72% { transform: scaleX(.75); }
      51%, 57%, 63%, 69% { transform: scaleX(1); }
    }

    @keyframes note {
      0%, 46% { opacity: 0; transform: translateY(0); }
      50% { opacity: 1; }
      62% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 0; }
    }

    @keyframes bubble { 0%, 78%, 97%, 100% { opacity: 0; } 80%, 95% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- notas musicais -->
  <text class="note n1" x="110" y="70">♪</text>
  <text class="note n2" x="290" y="60">♫</text>
  <text class="note n3" x="125" y="40">♫</text>

  <!-- balão de fala -->
  <g class="bubble">
    <rect x="284" y="8" width="124" height="30" rx="6"/>
    <path d="M296 38 l6 10 l6 -10" fill="#fff" stroke="#D97757" stroke-width="2" stroke-linejoin="round"/>
    <rect x="297" y="35" width="10" height="4" style="stroke:none"/>
    <text x="346" y="28" text-anchor="middle">bora codar?</text>
  </g>

  <rect class="shadow px" x="160" y="132" width="100" height="6"/>

  <g transform="translate(150 30)">
    <g class="jump">
      <g class="bob">
        <g class="sway px">
          <!-- braços -->
          <rect class="body arm-l" x="0" y="40" width="10" height="20"/>
          <rect class="body arm-r" x="110" y="40" width="10" height="20"/>
          <!-- corpo -->
          <rect class="body" x="10" y="20" width="100" height="60"/>
          <!-- pernas -->
          <rect class="body" x="20" y="80" width="10" height="20"/>
          <rect class="body" x="40" y="80" width="10" height="20"/>
          <rect class="body" x="70" y="80" width="10" height="20"/>
          <rect class="body" x="90" y="80" width="10" height="20"/>
          <!-- olhos -->
          <g class="look">
            <g class="eyes-open">
              <rect class="eye" x="35" y="35" width="10" height="15"/>
              <rect class="eye" x="75" y="35" width="10" height="15"/>
            </g>
            <g class="eyes-happy eye">
              <rect x="30" y="45" width="5" height="5"/>
              <rect x="35" y="40" width="10" height="5"/>
              <rect x="45" y="45" width="5" height="5"/>
              <rect x="70" y="45" width="5" height="5"/>
              <rect x="75" y="40" width="10" height="5"/>
              <rect x="85" y="45" width="5" height="5"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <text class="name" x="210" y="164" text-anchor="middle">MegaBrain Junior</text>
  <text class="tag" x="210" y="182" text-anchor="middle">meu parceiro de código</text>
</svg>
