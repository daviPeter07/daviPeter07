<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img" aria-label="Tecnologias: Next.js e Angular no frontend, NestJS e Go no backend">
  <title>Tecnologias</title>
  <style>
    :root { --card: #f6f8fa; --border: #d0d7de; --text: #1f2328; --muted: #57606a; }
    @media (prefers-color-scheme: dark) {
      :root { --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; }
    }
    .label { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; fill: var(--muted); }
    .rule { stroke: var(--border); stroke-width: 1.5; }
    .card-bg { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .card-glow { fill: none; stroke-width: 2.5; opacity: 0; animation: glow 8s infinite; }
    .name { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .desc { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); }
    .float { animation: float 3s ease-in-out infinite; }
    .wire { stroke: var(--border); stroke-width: 2; stroke-dasharray: 4 5; animation: dash 1s linear infinite; }
    .api { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--muted); letter-spacing: 1px; }
    .req { fill: #D97757; animation: req 2s ease-in-out infinite; }
    .res { fill: #00ADD8; animation: res 2s ease-in-out infinite 1s; }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes glow { 0%, 25%, 100% { opacity: 0; } 6%, 19% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -9; } }
    @keyframes req { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(52px); opacity: 0; } }
    @keyframes res { 0% { transform: translateX(0); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(-52px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .card-glow { opacity: 0; } }
  </style>

